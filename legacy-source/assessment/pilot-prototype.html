function explore(moveTo){
 if(moveTo){state.node=moveTo;state.moves++}
 const n=state.node,p=places[n];
 if(!state.events.collision&&state.moves>=4&&["17-to-18-2","18","14"].includes(n)){
  state.events.collision=true;render("xRush");return;
 }
 const choices=p.links.map(([label,go])=>({label,go}));
 for(const [label,line] of activities[n]||[])choices.push({label,observe:line});
 if(!state.events.stable&&state.moves>=2&&["14","15","17-to-18-2"].includes(n))choices.push({label:"Speak to the girl near the sign",encounter:"stableHello",event:"stable"});
 if(state.events.collision&&!state.events.second&&state.moves>=7&&["18","17-to-18-2","11"].includes(n))choices.push({label:"Approach the boy checking the crossing",encounter:"xSecondSight",event:"second"});
 if(state.events.collision&&!state.events.third&&state.moves>=11&&["21","19","20-to-21"].includes(n))choices.push({label:"Approach the boy beside the alley",encounter:"xThirdSight",event:"third"});
 if(state.events.collision&&!state.events.reveal&&state.moves>=16&&n==="19")choices.push({label:"Look toward the people by the closed stalls",encounter:"squareNotice",event:"reveal"});
 beats.explore={image:p.image,speaker:"",line:p.line,choices};render("explore");
}
let current="explore",activeImage=0,imageRequest=0;
const images=[document.getElementById("image-a"),document.getElementById("image-b")];
const xarArt=document.getElementById("xar-art"),stableArt=document.getElementById("stable-art");
const duet=new Set([]);
function backgroundFor(id){
 if(["start","cityEnd","openCity"].includes(id))return city("5");
 if(id.startsWith("x"))return ["xThird","xThirdAsk","xCertainty","xNotWell","xOut"].includes(id)?city("21"):city("18");
 if(id.startsWith("s"))return city("17");
 if(["aftermath","name","result","missed"].includes(id))return city("21");
 if(["pursuit","ghosting","was","lost"].includes(id))return city("18");
 return city("19");
}
function resetState(){state.knowsStable=false;state.knowsXar=false;state.intervention="watch";state.moves=0;state.node="5";state.events={};state.missedConfrontation=false;}
function render(id){
 if(id==="explore"&&current!=="explore"){current="explore";explore();return}const b=beats[id];if(!b)return;current=id;if(b.enterFlag)state[b.enterFlag]=true;document.querySelector(".stage").classList.toggle("cinematic",!!b.cinematic);
 const controls=document.getElementById("controls");controls.replaceChildren();
 const tail=(b.image||"").split("/").pop().replace(".webp","");
 const parts=tail.split("-"),character=["xar","stable"].includes(parts[0])?parts[0]:null;
 const backdrop=character?(b.cinematic?b.image:places[state.node].image):b.image,pair=duet.has(id);
 xarArt.classList.toggle("duet",pair);stableArt.classList.toggle("duet",pair);
 const xarPose=character==="xar"?parts[1]:pair?"4":null;
 const stablePose=character==="stable"?parts[1]:pair?"4":null;
 for(const [el,pose,name] of [[xarArt,xarPose,"xar"],[stableArt,stablePose,"stable"]]){
  el.classList.toggle("visible",!!pose);if(pose)el.src=asset(name+"-"+pose);
 }
 const showBeat=()=>{
  document.getElementById("chapter").textContent=places[state.node].name;
  document.getElementById("speaker").textContent=b.speaker==="Xar"?(state.knowsXar?"XAR":"STRANGER"):b.speaker==="Stable"?(state.knowsStable?"STABLE":"STRANGER"):b.speaker||"";
  document.getElementById("line").textContent=b.lines?.[state.intervention]||b.line;
  (b.choices||[{label:"Continue",next:b.next}]).filter(c=>!c.show||c.show()).forEach(c=>{
   const button=document.createElement("button");button.type="button";button.textContent=c.label;
   if(b.choices)button.classList.add("choice");
   button.onclick=()=>{if(c.set?.reset)resetState();else if(c.set)Object.assign(state,c.set);if(c.go){current="explore";explore(c.go)}else if(c.observe){beats.observation={image:places[state.node].image,speaker:"",line:c.observe,next:"explore"};render("observation")}else if(c.encounter){state.events[c.event]=true;render(c.encounter)}else if(c.href)location.href=c.href;else render(c.next)};
   controls.append(button)
  });
 };
 const next=images[1-activeImage],old=images[activeImage],request=++imageRequest;
 if(old.getAttribute("src")!==backdrop){
  next.onload=()=>{if(request!==imageRequest)return;next.classList.add("visible");old.classList.remove("visible");activeImage=1-activeImage;showBeat()};
  next.onerror=()=>{if(request===imageRequest)showBeat()};next.src=backdrop;
 }else{old.classList.add("visible");showBeat()}
}
document.getElementById("restart").onclick=()=>{resetState();current="explore";explore()};
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest("button")){e.preventDefault();document.querySelector("#controls button")?.click()}});
explore();
</script>
